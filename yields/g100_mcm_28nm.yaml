# Phase 3 planning assumptions for G100 + PTA MCM assembly.
# Every value is an assumption, not an OSAT quote or measured yield. G100 dies
# per wafer come from the existing G100 die-area model; the PTA die area and KGD
# parameters are explicit planning inputs because no PTA die-size model exists.
schema_version: "0.1"
id: g100_mcm_28nm
revision: "0.1.0"
product: g100
process: grx28@0.1.0
description: >-
  G100 wafer yield, PTA known-good-die supply, matched KGD pairing and three
  package options: silicon interposer, organic substrate and silicon bridge.
  Assembly yield uses an exponential per-interconnect defect term. All package
  costs and assembly rates are planning assumptions.

wafer:
  diameter_mm: 300.0
  edge_exclusion_mm: 3.0
  scribe_lane_um: 80.0
  g100_cost_usd: 4500.0
  pta_cost_usd: 3500.0

g100:
  critical_area_fraction: 0.35
  defect_density_per_cm2: 0.08
  kgd_test_yield: 0.995
  test_cost_usd: 0.35

pta:
  area_mm2: 50.0
  critical_area_fraction: 0.50
  defect_density_per_cm2: 0.08
  kgd_test_yield: 0.99
  test_cost_usd: 0.60

package_options:
  - id: silicon_interposer
    name: Silicon interposer
    kind: 2.5D silicon interposer
    assembly_base_yield: 0.995
    interconnect_count: 4000
    per_interconnect_ppm: 2.0
    package_cost_usd: 18.0
  - id: organic_substrate
    name: Organic substrate
    kind: 2.5D organic substrate
    assembly_base_yield: 0.992
    interconnect_count: 2500
    per_interconnect_ppm: 6.0
    package_cost_usd: 6.0
  - id: silicon_bridge
    name: Silicon bridge
    kind: silicon bridge on organic substrate
    assembly_base_yield: 0.994
    interconnect_count: 3000
    per_interconnect_ppm: 3.0
    package_cost_usd: 12.0
