# GRXGPU / PTA -- parallel throughput accelerator.
# ALL NUMBERS BELOW ARE PLANNING ASSUMPTIONS, not the real design database.
name: GRXGPU/PTA
description: >-
  Throughput-oriented GPU / parallel throughput accelerator on GRX28. Much
  larger logic and SRAM footprint, a 28 nm-realistic clock, higher switching
  activity, and a density-first library choice.
tech: grx28.yaml
library: lp28_7t5_1f
gates_m: 420
ff_ratio: 0.06
sram_mb: 48
io_mm2: 8.0
logic_depth_fo4: 22
activity: 0.18
target_freq_ghz: 0.75
vdd: 0.90
mbff_bits: 4
upsize_fins: 1
pin_aware: true
notes: >-
  7.5T single-finger is the density play at 28 nm. The risk is not cell height
  but pin access and long-wire drive. MBFF-4 and pin-density-aware placement are
  assumed in the reference configuration. 1.5 GHz is not a 28 nm target; the
  model's 0.73 GHz capability at 22 FO4 stages is the realistic ceiling here.
