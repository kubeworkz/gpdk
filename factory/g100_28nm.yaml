    tool_group: dice
    process_hours: 2.0
    batch_size: 4
    batch_wait_hours: 4.0
  - name: die_attach
    tool_group: die_attach
    process_hours: 3.0
    batch_size: 4
    batch_wait_hours: 6.0
    setup_hours: 0.5
  - name: underfill_cure
    tool_group: underfill
    process_hours: 1.5
    batch_size: 4
    batch_wait_hours: 4.0
  - name: mold
    tool_group: mold
    process_hours: 2.0
    batch_size: 4
    batch_wait_hours: 4.0
  - name: final_test
    tool_group: final_test
    process_hours: 8.0
    batch_size: 8
    batch_wait_hours: 8.0
  - name: pack_ship
    tool_group: pack_ship
    process_hours: 1.0

what_if:
  - id: higher_starts
    description: Raise wafer starts 33 percent to 800 per week.
    wafer_starts_per_week: 800.0
  - id: low_downtime
    description: Halve MTTR on every tool group at baseline starts.
    mttr_scale: 0.5
  - id: extra_litho
    roi_reference: higher_starts
    description: >-
      Add a fourth lithography scanner and hold starts at 800 per week. The
      scanner carries a $120k/week planning operating-cost delta and $60M
      capex depreciated over five years.
    wafer_starts_per_week: 800.0
    operating_cost_delta_usd_per_week: 120000.0
    tool_count_overrides:
      litho: 4
